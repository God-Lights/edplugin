name: EdPlugin
version: '${project.version}'
main: com.godlights.edplugin.EdPlugin
api-version: '1.21'
author: God-Lights
description: 'Survival co-op plugin: waystones, jobs economy, shops, death spectate, bounties.'
softdepend: [Vault]

commands:
  waystone:
    description: Manage and use waystones.
    aliases: [ws]
  jobs:
    description: View and manage your jobs.
  shop:
    description: Manage a personal shop.
  bounty:
    description: View active bounties.
  balance:
    description: Check your or another player's balance.
    aliases: [bal, money]
    permission: edplugin.balance.use
  edplugin:
    description: EdPlugin admin and manual command.
    aliases: [edp]

permissions:
  edplugin.admin:
    description: Access to all EdPlugin admin commands.
    default: op
  edplugin.waystone.create:
    description: Allows creating waystones.
    default: op
  edplugin.jobs.use:
    description: Allows joining jobs and earning job income.
    default: true
  edplugin.shop.use:
    description: Allows creating and using personal shops.
    default: true
  edplugin.bounty.use:
    description: Allows viewing bounties.
    default: true
  edplugin.helper:
    description: Allows reading the in-game manual (/edplugin helper).
    default: true
  edplugin.balance.use:
    description: Allows checking balances with /balance.
    default: true
